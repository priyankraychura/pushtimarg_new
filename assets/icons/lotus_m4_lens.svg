<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- M4 Lens: 3 solid lens petals, gradient, lots of air. Ultra-minimal. -->
  <defs>
    <linearGradient id="l1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E4789A"/><stop offset="1" stop-color="#FFB7CC"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2B134"/><stop offset="1" stop-color="#FFE08A"/></linearGradient>
    <path id="s" d="M0 40 C-60 -20 -60 -140 0 -210 C60 -140 60 -20 0 40Z"/>
  </defs>
  <rect width="512" height="512" rx="120" fill="#1E5A70"/>
  <g transform="translate(256 340)">
    <use href="#s" transform="rotate(-40)" fill="url(#l2)"/>
    <use href="#s" transform="rotate(40)" fill="url(#l2)"/>
    <use href="#s" fill="url(#l1)"/>
  </g>
</svg>
