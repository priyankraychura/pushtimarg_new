<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- V5 Chakra: circular medallion with gold ring, radial petals (symmetric, temple-style) -->
  <defs>
    <radialGradient id="mbg" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#255F76"/><stop offset="1" stop-color="#173F50"/></radialGradient>
    <linearGradient id="mp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E4789A"/><stop offset="1" stop-color="#FFE3EC"/></linearGradient>
    <linearGradient id="mp2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2B134"/><stop offset="1" stop-color="#FFF0C4"/></linearGradient>
    <path id="op" d="M0 0 C-30 -50 -30 -110 0 -160 C30 -110 30 -50 0 0Z"/>
    <path id="ip" d="M0 0 C-24 -40 -24 -80 0 -115 C24 -80 24 -40 0 0Z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#mbg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#F2B134" stroke-width="10"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#F2B134" stroke-width="2" opacity="0.6"/>
  <g transform="translate(256 256)">
    <g fill="url(#mp2)">
      <use href="#op"/><use href="#op" transform="rotate(45)"/><use href="#op" transform="rotate(90)"/><use href="#op" transform="rotate(135)"/>
      <use href="#op" transform="rotate(180)"/><use href="#op" transform="rotate(225)"/><use href="#op" transform="rotate(270)"/><use href="#op" transform="rotate(315)"/>
    </g>
    <g fill="url(#mp)" transform="rotate(22.5)">
      <use href="#ip"/><use href="#ip" transform="rotate(45)"/><use href="#ip" transform="rotate(90)"/><use href="#ip" transform="rotate(135)"/>
      <use href="#ip" transform="rotate(180)"/><use href="#ip" transform="rotate(225)"/><use href="#ip" transform="rotate(270)"/><use href="#ip" transform="rotate(315)"/>
    </g>
    <circle r="40" fill="#F2B134"/>
    <circle r="40" fill="none" stroke="#8A5A0A" stroke-width="3" opacity="0.5"/>
    <circle r="14" fill="#8A5A0A" opacity="0.55"/>
  </g>
