<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pushti Kirtan lotus icon — palette: teal #1E5A70 (Shyam), marigold #F2B134 (Kesar), rose #E4789A (Gulabi) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E5A70"/>
      <stop offset="1" stop-color="#1A4F63"/>
    </linearGradient>
    <linearGradient id="petalOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D9648A"/>
      <stop offset="1" stop-color="#FCE7EE"/>
    </linearGradient>
    <linearGradient id="petalMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4789A"/>
      <stop offset="1" stop-color="#FFD9E5"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F0A0BA"/>
      <stop offset="1" stop-color="#FFF4F8"/>
    </linearGradient>
    <radialGradient id="seed" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F2B134"/>
    </radialGradient>
  </defs>

  <!-- rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle halo -->
  <circle cx="256" cy="268" r="150" fill="#F2B134" opacity="0.10"/>

  <g transform="translate(256 330)">
    <!-- outer petals -->
    <path d="M0 0 C-60 -8 -130 -40 -150 -110 C-95 -112 -40 -80 0 0Z" fill="url(#petalOuter)"/>
    <path d="M0 0 C60 -8 130 -40 150 -110 C95 -112 40 -80 0 0Z" fill="url(#petalOuter)"/>

    <!-- middle petals -->
    <path d="M0 0 C-40 -40 -100 -110 -95 -190 C-45 -160 -10 -90 0 0Z" fill="url(#petalMid)"/>
    <path d="M0 0 C40 -40 100 -110 95 -190 C45 -160 10 -90 0 0Z" fill="url(#petalMid)"/>

    <!-- inner petals -->
    <path d="M0 0 C-22 -60 -50 -140 -30 -215 C0 -180 8 -100 0 0Z" fill="url(#petalInner)"/>
    <path d="M0 0 C22 -60 50 -140 30 -215 C0 -180 -8 -100 0 0Z" fill="url(#petalInner)"/>

    <!-- centre petal -->
    <path d="M0 0 C-18 -70 -18 -150 0 -235 C18 -150 18 -70 0 0Z" fill="#FFF8FB"/>

    <!-- seed pod -->
    <ellipse cx="0" cy="-12" rx="46" ry="22" fill="url(#seed)"/>
    <circle cx="-18" cy="-14" r="5" fill="#8A5A0A" opacity="0.6"/>
    <circle cx="0"   cy="-18" r="5" fill="#8A5A0A" opacity="0.6"/>
    <circle cx="18"  cy="-14" r="5" fill="#8A5A0A" opacity="0.6"/>

    <!-- water ripple -->
    <path d="M-120 34 Q-60 18 0 34 T120 34" fill="none" stroke="#F2B134" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M-80 60 Q-40 48 0 60 T80 60" fill="none" stroke="#F2B134" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
