<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- M5 Glass: soft gradient blobs behind a white glyph (iOS-style) -->
  <defs>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E4789A"/><stop offset="1" stop-color="#E4789A" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F2B134"/><stop offset="1" stop-color="#F2B134" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#245F76"/><stop offset="1" stop-color="#153E4E"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <path id="t" d="M0 30 C-46 -20 -46 -120 0 -180 C46 -120 46 -20 0 30Z"/>
    <clipPath id="c"><rect width="512" height="512" rx="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="150" cy="170" r="190" fill="url(#b1)" filter="url(#blur)"/>
    <circle cx="380" cy="360" r="200" fill="url(#b2)" filter="url(#blur)"/>
  </g>
  <g transform="translate(256 330)" fill="#fff">
    <use href="#t" transform="rotate(-56)" opacity="0.55"/>
    <use href="#t" transform="rotate(56)" opacity="0.55"/>
    <use href="#t" transform="rotate(-28)" opacity="0.8"/>
    <use href="#t" transform="rotate(28)" opacity="0.8"/>
    <use href="#t"/>
  </g>
</svg>
