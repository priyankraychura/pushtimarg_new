name: pushti_kirtan
description: "Pushtimarg bhajan and kirtan lyrics app."
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.13.4

dependencies:
  animations: ^3.0.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: YatraOne
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
    - family: MuktaVaani
      fonts:
        - asset: assets/fonts/MuktaVaani-Regular.ttf
        - asset: assets/fonts/MuktaVaani-Medium.ttf
          weight: 500
        - asset: assets/fonts/MuktaVaani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MuktaVaani-Bold.ttf
          weight: 700
    - family: HindVadodara
      fonts:
        - asset: assets/fonts/HindVadodara-Regular.ttf
        - asset: assets/fonts/HindVadodara-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindVadodara-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindVadodara-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
